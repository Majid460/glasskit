name: CI
on:
  push: { branches: [main] }
  pull_request:
jobs:
  android-and-common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :glasskit:testDebugUnitTest :sample:assembleDebug
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :glasskit:compileKotlinIosSimulatorArm64 :glasskit:iosSimulatorArm64Test
