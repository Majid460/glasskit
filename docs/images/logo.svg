<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="GlassKit logo" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0D1C"/><stop offset="1" stop-color="#1a0f3d"/></linearGradient>
  <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5CE1FF"/><stop offset=".5" stop-color="#9B7BFF"/><stop offset="1" stop-color="#FF5CAA"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset=".5" stop-color="#fff" stop-opacity=".15"/><stop offset="1" stop-color="#5CE1FF" stop-opacity=".6"/></linearGradient>
  <linearGradient id="pill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".34"/><stop offset="1" stop-color="#fff" stop-opacity=".12"/></linearGradient>
  <radialGradient id="a" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#9B7BFF" stop-opacity=".9"/><stop offset="1" stop-color="#9B7BFF" stop-opacity="0"/></radialGradient>
  <radialGradient id="b" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#5CE1FF" stop-opacity=".8"/><stop offset="1" stop-color="#5CE1FF" stop-opacity="0"/></radialGradient>
  <radialGradient id="c" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FF5CAA" stop-opacity=".8"/><stop offset="1" stop-color="#FF5CAA" stop-opacity="0"/></radialGradient>
  <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="sq"><rect width="512" height="512" rx="116"/></clipPath>
</defs>
<g clip-path="url(#sq)">
  <rect width="512" height="512" fill="url(#bg)"/>
  <circle cx="400" cy="110" r="200" fill="url(#a)"/>
  <circle cx="90" cy="400" r="190" fill="url(#b)"/>
  <circle cx="440" cy="440" r="140" fill="url(#c)"/>
  <!-- content cards passing behind the glass -->
  <rect x="70" y="86" width="160" height="290" rx="28" fill="#5CE1FF" opacity=".55" transform="rotate(-8 150 200)"/>
  <rect x="280" y="64" width="160" height="310" rx="28" fill="#FF5CAA" opacity=".6" transform="rotate(7 360 190)"/>
  <rect x="170" y="150" width="170" height="290" rx="28" fill="#9B7BFF" opacity=".7"/>
  <!-- glass pill -->
  <rect x="62" y="312" width="388" height="132" rx="66" fill="url(#pill)" stroke="url(#edge)" stroke-width="4"/>
  <path d="M110 330 Q256 306 402 330" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="5" stroke-linecap="round"/>
  <!-- selected capsule -->
  <rect x="190" y="326" width="132" height="104" rx="52" fill="#5CE1FF" fill-opacity=".28" stroke="#fff" stroke-opacity=".5" stroke-width="2"/>
  <g filter="url(#glow)" fill="#fff">
    <circle cx="126" cy="378" r="16" fill-opacity=".8"/>
    <circle cx="256" cy="378" r="20" fill="url(#brand)"/>
    <circle cx="386" cy="378" r="16" fill-opacity=".8"/>
  </g>
</g>
<rect width="512" height="512" rx="116" fill="none" stroke="url(#edge)" stroke-width="4"/>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
