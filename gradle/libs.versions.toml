# Versions follow JetBrains docs: Compose Multiplatform 1.10.3 pairs with Navigation 3 1.0.0-alpha06 (needs compileSdk 36, AGP 8.x).
# 1.12.x needs compileSdk 37 + AGP 9.1, which changes KMP library setup, so we stay on 1.10.3 for now.
[versions]
kotlin = "2.2.20"
agp = "8.11.1"
compose-multiplatform = "1.10.3"
nav3-ui = "1.0.0-alpha06"
activity-compose = "1.10.1"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
jetbrains-navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "nav3-ui" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
